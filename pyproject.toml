[project]
name = "vbagent"
version = "0.3.8"
description = "Physics question processing library and CLI - classification, LaTeX extraction, variant generation"
authors = [
    {name = "vaibhavblayer", email = "vaibhavblayer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.6.2",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=1.0.0",
    "pymdown-extensions>=10.0.0",
]
# Full installation (same as base - kept for backward compatibility)
all = [
    "openai-agents>=0.6.2",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
vbagent = "vbagent.cli.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mkdocs-material (>=9.7.1,<10.0.0)",
    "mkdocstrings (>=1.0.3,<2.0.0)",
    "pymdown-extensions (>=10.20.1,<11.0.0)"
]
