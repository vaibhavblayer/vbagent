[project]
name = "vbagent"
version = "0.2.1"
description = "Physics question processing library and CLI - classification, LaTeX extraction, variant generation"
authors = [
    {name = "vaibhavblayer", email = "vaibhavblayer@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.6.2",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
    "jsonschema>=4.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.1.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]
# Full installation (library + CLI)
all = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
vbagent = "vbagent.cli.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
