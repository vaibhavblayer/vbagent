site_name: VBAgent Documentation
site_description: Multi-agent physics question processing system with conversational interface
site_author: vaibhavblayer
repo_url: https://github.com/vaibhavblayer/vbagent
repo_name: vaibhavblayer/vbagent
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Roboto Mono
    code: Courier New
  palette:
    # Dark mode (default)
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - CLI Commands: user-guide/cli-commands.md
    - Chat Interface: user-guide/chat.md
    - Problem Generation: user-guide/problem-generation.md
    - Image Processing: user-guide/image-processing.md
    - Batch Processing: user-guide/batch-processing.md
    - Database Management: user-guide/database.md
  - API Reference:
    - Agents: api/agents.md
    - Classification: api/classification.md
    - Models: api/models.md
    - CLI: api/cli.md
    - Orchestrator: api/orchestrator.md
  - Examples:
    - Basic Usage: examples/basic.md
    - Advanced Workflows: examples/advanced.md
    - Custom Agents: examples/custom.md
  - Development:
    - Contributing: development/contributing.md
    - Architecture: development/architecture.md
    - Testing: development/testing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vaibhavblayer/vbagent
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/vbagent/
